<html>
<center>
<head>
   <title>basic form</title>
</head>
<body bgcolor="pink">
   <h2>student registration form</h2>
   
   
    <form> 
	  <label> name: </label>
	  <input type="text" name="name">
	  <br><br>
	  
	  <label> email: </label>
	  <input type="email" name="email">
	  <br><br>
	  
	  <label> password: </label>
	  <input type="password" name="password">
	  <br><br>
	  
	  <label> age: </label>
	  <input type="number" name="age">
	  <br><br>
	  
	  <label> gender: </label>
	  <input type="radio" name="gender" value="male">male
	   <input type="radio" name="gender" value="female">female
	  <br><br>
	  
	  <label>hobbies</label>
	   <input type="checkbox" name="hobbies" value="cricet">cricket
	   <input type="checkbox" name="hobbies" value="travelling">travelling
	   <input type="checkbox" name="checkbox" value="explore ">explore
	   <br><br>
	   
	  <label> course: </label>
	  <select name="course">
	    <option value="bsc.it">bsc.it</option>
		<option value="bca">bca</option>
		<option value="mca">mca</option>
	  </select>
		<br><br>
	  
	  
	  <label> address: </label>
	  <textarea name="address"></textarea>
	  <br><br>
	  
	  <label>date:</label>
	  <input type="date" name="date">
	  <br><br>
	  
	  <label> range: </label>
	   0<input type="range" name="range">100
	  <br><br>
	  
	  
	  <label>number:</label>
	  <input type="number" name="number">
	  <br><br>
	  
	  <label>file chose option:</label>
	  <input type="file" name="file">
	  <br><br>
	  
	  <input type="submit" value="submit">
	  <input type="reset" value="reset">
	  <br><br>
	  
	</form>
</body>
</center>
</html>
